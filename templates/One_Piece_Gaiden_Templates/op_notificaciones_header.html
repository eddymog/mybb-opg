<style>
/* Campana de notificaciones (prefijo op-notif-campana): comparte fila con la barra de la Bitácora (#op-temas-header) */
.op-barra-usuario { display: flex; align-items: stretch; box-sizing: border-box; width: min(1100px, calc(100% - 20px)); margin: 0 auto; }
.op-barra-usuario > .op-temas-header { flex: 1 1 auto; min-width: 0; width: auto; margin: 0; }
.op-notif-campana {
  flex: 0 0 auto; box-sizing: border-box; height: 30px; margin-left: auto;
  border: 2px solid var(--opg-tinta); border-top: 3px solid var(--opg-morado-texto);
  background: var(--opg-crema-clara); box-shadow: 0 2px 0 var(--opg-tinta);
}
.op-barra-usuario > .op-temas-header + .op-notif-campana { border-right: 0; margin-left: 0; }
.op-notif-campana--importante { border-top-color: var(--opg-naranja-accion); }
.op-notif-campana a {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 5px;
  box-sizing: border-box; min-width: 44px; height: 25px; padding: 0 10px;
  color: var(--opg-morado-texto) !important; text-decoration: none; transition: background var(--opg-rapido);
}
.op-notif-campana a:hover { background: var(--opg-crema-dorada); }
.op-notif-campana a:focus-visible { outline: none; box-shadow: var(--opg-foco); }
.op-notif-campana a > i { font-size: 13px; }
.op-notif-campana--importante a > i { color: var(--opg-naranja-accion); }
.op-notif-campana__insignia {
  min-width: 16px; padding: 0 4px; border: 1px solid var(--opg-tinta); border-radius: 8px; box-sizing: border-box;
  color: #fff; background: var(--opg-morado-texto); font: 10px/14px var(--opg-fuente-titular); text-align: center;
}
.op-notif-campana--importante .op-notif-campana__insignia { background: var(--opg-naranja-accion); }
.op-notif-campana__texto {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
  clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
@media (max-width: 420px) {
  .op-barra-usuario .op-temas-header__conteos { grid-template-columns: repeat(2, minmax(56px, 1fr)); }
  .op-barra-usuario .op-temas-header__contador { min-width: 56px; padding: 1px 4px; }
  .op-notif-campana a { min-width: 40px; padding: 0 7px; }
}
</style>
<div id="op-notif-campana" class="op-notif-campana{$op_notif_campana_clase}"
    hx-swap-oob="outerHTML:#op-notif-campana">
    <a href="{$mybb->settings['bburl']}/op/notificaciones.php" title="{$op_notif_campana_etiqueta}">
        <i class="fa-solid fa-bell" aria-hidden="true"></i>
        {$op_notif_campana_insignia}
        <span class="op-notif-campana__texto">{$op_notif_campana_etiqueta}</span>
    </a>
</div>
