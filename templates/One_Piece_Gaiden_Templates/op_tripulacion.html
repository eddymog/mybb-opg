<html>
<head>
<title>{$t_nombre} — {$bbname_html}</title>
{$headerinclude}
<!-- fontawesome+solid, no all.min.css: ver nota en docs/style.md §7 sobre por
     qué all.min.css hace aparecer iconos del menú del header que en el resto
     del foro no se ven. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css" crossorigin="anonymous" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css" crossorigin="anonymous" />
<style>
.tr-pagina .thirdBackground { width: 100%; max-width: 1030px; gap: var(--opg-espacio-5); text-align: left; }

.tr-titulo { padding: var(--opg-espacio-2); }
.tr-titulo .barra-texto-op { font-size: 24px; letter-spacing: 2px; text-shadow: 2px 2px 0 black; }

.aviso { font-family: var(--opg-fuente-cuerpo); color: #fff; margin: 0; border: 2px solid var(--opg-tinta); border-radius: var(--opg-radio-md); padding: 10px 14px; }
.aviso.ok  { background: var(--opg-verde-exito); }
.aviso.err { background: var(--opg-rojo-error); }

/* Identidad: logo + nombre/form + badges, un solo bloque (ver style.md §7 "menos cajas anidadas") */
.tr-identidad {
    display: flex; gap: var(--opg-espacio-4); align-items: flex-start; flex-wrap: wrap;
    border: 2px solid var(--opg-tinta); border-radius: var(--opg-radio-md); background: var(--opg-crema-clara);
    padding: var(--opg-espacio-4); box-shadow: var(--opg-sombra-offset);
}
.tr-logo, .tr-logo-vacio {
    width: 90px; height: 90px; border: 2px solid var(--opg-tinta); border-radius: var(--opg-radio-md);
    object-fit: cover; flex-shrink: 0;
}
.tr-logo-vacio { display: flex; align-items: center; justify-content: center; background: var(--opg-crema-dorada); color: var(--opg-gris-texto); font-size: 28px; }
.tr-identidad-info { flex: 1 1 240px; display: flex; flex-direction: column; gap: var(--opg-espacio-2); }
.tr-nombre-fijo { margin: 0; font-family: var(--opg-fuente-titular); font-weight: normal; font-size: 22px; color: var(--opg-ciruela); }
.tr-mensaje-publico { margin: 0; font-family: var(--opg-fuente-cuerpo); font-size: 13px; font-style: italic; color: var(--opg-marron); }
.tr-check { display: flex; align-items: center; gap: 6px; font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); }
.tr-identidad-form { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-3); align-items: flex-end; }
.af-field { display: flex; flex-direction: column; gap: 4px; flex: 1 1 190px; }
.af-field label { font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--opg-morado-texto); }
.af-field input {
    box-sizing: border-box; padding: 8px 10px; border: 2px solid var(--opg-tinta); border-radius: var(--opg-radio-sm);
    background: #fff; color: var(--opg-ciruela); font-family: var(--opg-fuente-cuerpo); font-size: 14px;
}

.tr-badges { display: flex; flex-wrap: wrap; gap: 6px; }
.tr-badge {
    font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
    color: #fff; background: var(--opg-morado-texto); border-radius: 999px; padding: 3px 12px;
}

/* Título de sección con raya de acento (ver style.md §7: "menos cajas anidadas") */
.tr-seccion-titulo {
    display: inline-block; margin: 0 0 var(--opg-espacio-4); font-family: var(--opg-fuente-titular); font-weight: normal;
    font-size: 16px; letter-spacing: 1px; text-transform: uppercase; color: var(--opg-ciruela);
    padding-bottom: 4px; border-bottom: 5px solid var(--opg-naranja);
}

.tr-agregar { display: flex; gap: var(--opg-espacio-3); align-items: center; margin-bottom: var(--opg-espacio-4); }
.tr-agregar #tr-buscar {
    width: 260px; box-sizing: border-box; padding: 8px 10px; border: 2px solid var(--opg-tinta); border-radius: var(--opg-radio-sm);
    font-family: var(--opg-fuente-cuerpo); font-size: 13px;
}

.tr-lista-miembros { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.tr-miembro {
    display: flex; align-items: center; gap: var(--opg-espacio-3); flex-wrap: wrap;
    border: 2px solid var(--opg-tinta); border-radius: var(--opg-radio-sm); background: #fff; padding: 8px 12px;
}
.tr-badge-capitan, .tr-badge-vice, .tr-badge-miembro {
    font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
    color: #fff; border-radius: 999px; padding: 2px 10px; flex-shrink: 0;
}
.tr-badge-capitan { background: var(--opg-naranja); }
.tr-badge-vice { background: var(--opg-morado-texto); }
.tr-badge-miembro { background: var(--opg-gris-bloqueado); }
.tr-miembro-nombre { font-family: var(--opg-fuente-cuerpo); font-weight: bold; color: var(--opg-morado-texto); text-decoration: none; }
.tr-miembro-rol { font-family: var(--opg-fuente-cuerpo); font-size: 12px; font-style: italic; color: var(--opg-gris-texto); }
.tr-miembro-acciones { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.tr-inline { display: inline; margin: 0; }
.tr-rango-form select {
    font-family: var(--opg-fuente-cuerpo); font-size: 12px; padding: 3px 6px; border: 2px solid var(--opg-tinta);
    border-radius: var(--opg-radio-sm); background: #fff;
}

@media (max-width: 700px) {
    .tr-pagina .secondBackground, .tr-pagina .thirdBackground { padding: 10px; }
    .tr-miembro-acciones { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
{$header}
<div class="indice tr-pagina">
<div class="mainBackground">
<div class="secondBackground">
<div class="thirdBackground">

    <div class="barra-op bbox tr-titulo"><span class="barra-texto-op">Tripulación</span></div>

    {$msg_html}

    <div class="tr-identidad">
        {$t_logo_html}
        <div class="tr-identidad-info">
            {$t_identidad_html}
            <div class="tr-badges">
                <span class="tr-badge">{$t_faccion}</span>
                <span class="tr-badge">{$t_estado}</span>
                <span class="tr-badge">Reputación: {$t_reputacion}</span>
            </div>
        </div>
    </div>

    <section>
        <h2 class="tr-seccion-titulo">Miembros</h2>
        {$agregar_html}
        {$miembros_html}
    </section>

</div>
</div>
</div>
</div>
{$footer}
<script>
(function () {
    var buscar = document.getElementById('tr-buscar');
    if (!buscar) { return; }

    var resultados = document.getElementById('tr-resultados');
    var form = document.getElementById('tr-agregar-form');
    var fidInput = document.getElementById('tr-agregar-fid');
    var debounceTimer = null;

    buscar.addEventListener('input', function () {
        var q = buscar.value.trim();
        clearTimeout(debounceTimer);
        if (q === '') { resultados.hidden = true; return; }
        debounceTimer = setTimeout(function () {
            fetch('tripulacion.php?buscar_personaje=' + encodeURIComponent(q))
                .then(function (r) { return r.json(); })
                .then(function (items) {
                    resultados.innerHTML = '';
                    if (items.length === 0) {
                        var vacio = document.createElement('div');
                        vacio.className = 'opg-resultado-vacio';
                        vacio.textContent = 'Sin resultados.';
                        resultados.appendChild(vacio);
                    } else {
                        items.forEach(function (item) {
                            var btn = document.createElement('button');
                            btn.type = 'button';
                            btn.className = 'opg-resultado';
                            btn.textContent = item.nombre;
                            btn.addEventListener('click', function () {
                                fidInput.value = item.fid;
                                form.submit();
                            });
                            resultados.appendChild(btn);
                        });
                    }
                    resultados.hidden = false;
                });
        }, 200);
    });

    document.addEventListener('click', function (e) {
        if (!e.target.closest('.opg-buscar-caja')) { resultados.hidden = true; }
    });
})();
</script>
</body>
</html>
