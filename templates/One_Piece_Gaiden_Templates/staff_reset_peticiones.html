<html>
<head>
    <title>Reset de Build — Staff</title>
    <style>
    body { font-family: 'moonGetHeavy', Arial, sans-serif; background: #f8f8f8; }
    .rst-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
    .rst-h2 { color: #b91c1c; font-size: 22px; margin: 0 0 16px; }
    .rst-back { color: #ea580c; text-decoration: none; font-size: 14px; }
    .rst-back:hover { text-decoration: underline; }

    /* Tabs */
    .rst-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .rst-tabs a { padding: 6px 16px; border-radius: 4px; text-decoration: none; font-size: 13px; color: #374151; background: #e5e7eb; }
    .rst-tabs a.rst-tab-active, .rst-tabs a:hover { background: #ea580c; color: #fff; }

    /* Table */
    .rst-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .rst-table th { background: #1f2937; color: #f9fafb; padding: 10px 14px; font-size: 13px; text-align: left; }
    .rst-table td { padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #e5e7eb; color: #111827; }
    .rst-table tr:last-child td { border-bottom: none; }
    .rst-table tr:hover td { background: #fef3c7; }

    /* Estado badges */
    .rst-estado { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .rst-estado-pendiente { background: #fef9c3; color: #92400e; }
    .rst-estado-aplicado  { background: #dcfce7; color: #166534; }
    .rst-estado-rechazado { background: #fee2e2; color: #991b1b; }

    /* Detail view */
    .rst-sections { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .rst-section { border-top: 1px solid #e5e7eb; padding-top: 14px; margin-bottom: 14px; }
    .rst-section:first-child { border-top: none; padding-top: 0; }
    .rst-stitle { font-size: 11px; letter-spacing: 2px; color: #ea580c; margin-bottom: 10px; font-weight: bold; }
    .rst-g3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .rst-g4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
    .rst-g2 { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
    .rst-slot { display: flex; flex-direction: column; }
    .rst-bslot { display: flex; flex-direction: column; gap: 4px; }
    .rst-camino-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 4px; padding: 6px; margin-top: 4px; }
    .rst-changed.rst-bslot > .rst-slabel { color: #ea580c; }
    .rst-slabel { font-size: 11px; color: #6b7280; margin-bottom: 3px; }
    .rst-bak { font-style: italic; color: #9ca3af; font-size: 10px; }
    .rst-sel, .rst-inp { padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; background: #fff; width: 100%; box-sizing: border-box; }
    .rst-sel:focus, .rst-inp:focus { outline: none; border-color: #f97316; }
    .rst-textarea { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 5px; font-size: 13px; resize: vertical; box-sizing: border-box; }

    /* Changed field highlight */
    .rst-changed .rst-inp, .rst-changed .rst-sel { border-color: #f97316; background: #fff7ed; }
    .rst-changed .rst-slabel { color: #ea580c; }

    /* Actions */
    .rst-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; padding-top: 16px; border-top: 2px solid #e5e7eb; }
    .rst-btn { padding: 9px 20px; border: none; border-radius: 6px; font-size: 13px; font-family: 'moonGetHeavy', Arial; cursor: pointer; text-decoration: none; display: inline-block; }
    .rst-btn-save  { background: #1d4ed8; color: #fff; }
    .rst-btn-apply { background: #16a34a; color: #fff; }
    .rst-btn-reject{ background: #dc2626; color: #fff; }
    .rst-btn-small { background: #ea580c; color: #fff; padding: 5px 14px; font-size: 12px; }
    .rst-btn:hover { opacity: .85; }

    /* Alerts */
    .rst-alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 13px; }
    .rst-ok   { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .rst-warn { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .rst-check { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
    .rst-hint { font-size: 12px; color: #9ca3af; margin-top: 3px; }
    .rst-notas { font-size: 13px; color: #374151; white-space: pre-wrap; }
    .rst-readonly-note { background: #f3f4f6; border: 1px solid #d1d5db; padding: 10px; border-radius: 6px; font-size: 13px; color: #6b7280; margin-bottom: 14px; }
    @media(max-width:700px){ .rst-g3,.rst-g4{grid-template-columns:repeat(2,1fr);} .rst-g2{grid-template-columns:1fr;} }
    </style>
    {$headerinclude}
</head>
<body>
    {$header}
    <div class="rst-wrap">
        {$reset_content}
    </div>
    {$footer}
</body>
</html>
