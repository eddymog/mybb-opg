<html>
<head>
    <title>{$op_temas_html_title}</title>
    {$headerinclude}
    <script src="{$mybb->settings['bburl']}/jscripts/vendor/htmx-2.0.10.min.js"></script>
    <script defer src="{$mybb->settings['bburl']}/jscripts/vendor/alpinejs-3.17.3.min.js"></script>
</head>
<body>
    {$header}
    <div class="indice op-temas-page"><div class="mainBackground"><div class="secondBackground"><div class="thirdBackground">
        <main class="op-temas-shell" x-data="{ selectorVista: false }" @keydown.escape.window="selectorVista = false">
            <header class="op-temas-page-header">
                <div>
                    <h1>{$op_temas_titulo}</h1>
                    <p>{$op_temas_subtitulo}</p>
                </div>
                <button type="button" class="btn-op btn-op--secundario op-temas-selector-boton"
                    @click="selectorVista = !selectorVista" :aria-expanded="selectorVista.toString()"
                    aria-controls="op-temas-selector-vista">
                    <i class="fa-solid fa-eye" aria-hidden="true"></i> Ver otro personaje
                </button>
            </header>
            <section id="op-temas-selector-vista" class="op-temas-selector" x-show="selectorVista" x-cloak>
                <div>
                    <h2>Buscar personaje</h2>
                    <p>Consulta sus temas por nombre o FID.</p>
                </div>
                <div class="op-temas-selector__buscador opg-buscar-caja">
                    <label class="sr-only" for="op-temas-buscar-vista">Nombre o FID</label>
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input type="search" id="op-temas-buscar-vista" name="q" autocomplete="off"
                        placeholder="Nombre o FID" aria-autocomplete="list"
                        aria-controls="op-temas-vista-resultados"
                        hx-get="/op/temas.php" hx-trigger="keyup changed delay:250ms"
                        hx-target="#op-temas-vista-resultados"
                        hx-sync="this:replace"
                        hx-vals='{"action":"buscar_modo_vista","modo_vista":"{$op_temas_vista_uid}"}'>
                    <small class="op-temas-buscador__ayuda">Nombre desde 3 letras &middot; FID directo</small>
                    <div id="op-temas-vista-resultados" class="op-temas-resultados opg-resultados" role="listbox"></div>
                </div>
                <button type="button" class="op-temas-icono" title="Cerrar buscador" aria-label="Cerrar buscador"
                    @click="selectorVista = false">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </section>
            {$op_temas_tracker}
        </main>
    </div></div></div></div>
    {$footer}
    <script>
    (function () {
        var typeaheadStates = new WeakMap();

        function cancelTypeahead(input) {
            var state = typeaheadStates.get(input);
            if (!state) return;
            if (state.timer) window.clearTimeout(state.timer);
            if (state.controller) state.controller.abort();
            typeaheadStates.delete(input);
        }

        document.addEventListener('toggle', function (event) {
            if (event.target.matches('.op-temas-config') && !event.target.open) {
                event.target.querySelectorAll('[data-op-temas-typeahead]').forEach(function (input) {
                    cancelTypeahead(input);
                });
                event.target.querySelectorAll('.op-temas-resultados').forEach(function (results) {
                    results.innerHTML = '';
                });
                return;
            }
            if (!event.target.matches('.op-temas-narrador, .op-temas-agregar-control')) return;
            var input = event.target.querySelector('input[type="search"]');
            if (!input) return;
            if (event.target.open) {
                window.requestAnimationFrame(function () { input.focus(); });
                return;
            }
            cancelTypeahead(input);
            var results = event.target.querySelector('.op-temas-resultados');
            if (results) results.innerHTML = '';
        }, true);

        document.addEventListener('input', function (event) {
            if (!event.target.matches('[data-op-temas-typeahead]')) return;
            var input = event.target;
            var form = event.target.closest('form');
            var hidden = form ? form.querySelector('.op-temas-participante-uid') : null;
            if (hidden) hidden.value = '';
            var results = document.getElementById(input.getAttribute('data-results-id'));
            cancelTypeahead(input);
            if (results) results.innerHTML = '';

            var query = input.value.trim();
            if (query.length < 3 || !results) return;

            var state = { timer: null, controller: null };
            state.timer = window.setTimeout(function () {
                state.timer = null;
                state.controller = new AbortController();
                results.innerHTML = '<p class="opg-resultado-vacio">Buscando...</p>';

                fetch('/op/temas.php?action=buscar_personajes&q=' + encodeURIComponent(query), {
                    credentials: 'same-origin',
                    signal: state.controller.signal
                }).then(function (response) {
                    if (!response.ok) throw new Error('search_failed');
                    return response.text();
                }).then(function (html) {
                    if (input.value.trim() !== query) return;
                    results.innerHTML = html;
                }).catch(function (error) {
                    if (error.name === 'AbortError' || input.value.trim() !== query) return;
                    results.innerHTML = '<p class="opg-resultado-vacio">No se pudo completar la búsqueda.</p>';
                });
            }, 220);
            typeaheadStates.set(input, state);
        });

        document.addEventListener('click', function (event) {
            var option = event.target.closest('.op-temas-personaje-opcion');
            if (option) {
                var form = option.closest('form');
                var input = form.querySelector('input[type="search"]');
                var hidden = form.querySelector('.op-temas-participante-uid');
                input.value = option.getAttribute('data-label') || '';
                hidden.value = option.getAttribute('data-uid') || '';
                var results = form.querySelector('.op-temas-resultados');
                if (results) results.innerHTML = '';
                return;
            }
            if (!event.target.closest('.op-temas-buscador')) {
                document.querySelectorAll('.op-temas-resultados').forEach(function (results) {
                    results.innerHTML = '';
                });
            }
        });
    }());
    </script>
</body>
</html>
