<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css">

<style>
/* Respaldo local: la consola sigue presentando bien la guía aunque el CSS estático tarde en actualizarse. */
.ca-consola .ca-guia { overflow: hidden; border: 2px solid var(--opg-tinta); border-radius: 7px; background: var(--opg-crema-clara); box-shadow: 3px 3px 0 var(--opg-tinta); }
.ca-consola .ca-guia > summary { display: flex; min-height: 40px; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 11px; background: var(--opg-morado-cta); color: #fff; font-family: var(--opg-fuente-titular); font-size: 13px; cursor: pointer; list-style: none; text-shadow: var(--opg-sombra-titular); }
.ca-consola .ca-guia > summary::-webkit-details-marker { display: none; }
.ca-consola .ca-guia > summary > span { display: inline-flex; align-items: center; gap: 8px; }
.ca-consola .ca-guia .ta-guia-flecha { flex: 0 0 auto; transition: transform var(--opg-rapido); }
.ca-consola .ca-guia[open] .ta-guia-flecha { transform: rotate(180deg); }
.ca-consola .ca-guia .ta-guia-contenido { padding: 11px 12px; color: var(--opg-marron); font-family: var(--opg-fuente-cuerpo); font-size: 11px; line-height: 1.45; }
.ca-consola .ca-guia .ta-guia-intro { margin: 0 0 9px; padding: 7px 9px; border-left: 4px solid var(--opg-naranja); background: var(--opg-crema-dorada); }
.ca-consola .ca-guia .ta-guia-secciones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 18px; border-bottom: 1px solid rgba(0,0,0,.18); }
.ca-consola .ca-guia .ta-guia-secciones section { min-width: 0; padding: 9px 0; border-top: 1px solid rgba(0,0,0,.18); }
.ca-consola .ca-guia .ta-guia-secciones h3 { display: flex; align-items: center; gap: 7px; margin: 0 0 4px; color: var(--opg-morado-texto); font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; }
.ca-consola .ca-guia .ta-guia-secciones h3 i { width: 16px; color: var(--opg-naranja); text-align: center; }
.ca-consola .ca-guia .ta-guia-secciones p, .ca-consola .ca-guia .ta-guia-estados { margin: 0; }
.ca-consola .ca-guia .ta-guia-secciones ul { margin: 6px 0 0; padding-left: 16px; }
.ca-consola .ca-guia .ta-guia-secciones li { margin: 0 0 4px; }
.ca-consola .ca-guia .ta-guia-secciones li:last-child { margin-bottom: 0; }
.ca-consola .ca-guia .ta-guia-estados { padding-top: 9px; color: var(--opg-gris-texto); }
.ca-consola .ca-guia .ta-guia-estados strong { color: var(--opg-morado-texto); }
@media (max-width: 700px) { .ca-consola .ca-guia .ta-guia-secciones { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body class="ca-pagina-consola" hx-headers='{"X-Post-Key":"{$post_key}"}'>
{$header}

<main class="thirdBackground">

    <header class="ca-encabezado">
        <span class="ca-encabezado-icono"><i class="fa-solid fa-compass" aria-hidden="true"></i></span>
        <div><h1>Consola de aventuras</h1><p>Revisa solicitudes, entregas y ofertas de narración.</p></div>
    </header>

    <div class="ta-avisos-globales" id="ta-avisos" aria-live="polite"></div>
    {$guia_html}
    {$tabs_html}
    <div class="ca-panel-cargando htmx-indicator" id="ca-panel-cargando" role="status" aria-label="Cargando sección"></div>
    <div id="ca-panel" aria-busy="false">{$panel_html}</div>
    <div id="ca-overlay"></div>

</main>
</div>
</div>
</div>

<script src="{$asset_url}/jscripts/consola_aventuras.js?v=2" defer></script>
{$footer}

</html>
