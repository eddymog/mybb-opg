<style>
/* ── Marco de la página ─────────────────────────────────────────────────── */
/* text-align: el body del tema centra todo el texto (style.md, sección 7) */
.ca-consola .thirdBackground { width: 100%; max-width: 1030px; gap: var(--opg-espacio-5); text-align: left; }
.ta-titulo-pagina { padding: var(--opg-espacio-2); }

.ta-descripcion { font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); text-align: left; padding: 10px 14px; line-height: 1.5; }
.ta-oculto { display: none !important; }
.htmx-request { opacity: .75; }

/* ── Pestañas ───────────────────────────────────────────────────────────── */
.ta-tabs { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-2); border-bottom: 3px solid var(--opg-tinta); }
.ta-tab, a.ta-tab:link, a.ta-tab:visited {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 14px; color: var(--opg-ciruela); text-decoration: none;
    background: var(--opg-crema-clara); border: 2px solid var(--opg-tinta); border-bottom: 0; border-radius: 10px 10px 0 0;
    padding: 8px 16px; transition: background var(--opg-rapido);
}
.ta-tab:hover { background: #ffd48a; }
.ta-tab-activa, a.ta-tab-activa:link, a.ta-tab-activa:visited { background: #ffa600; color: #fff; text-shadow: var(--opg-sombra-titular); }
.ta-contador, .opg-chip.ta-contador { background: var(--opg-morado-cta); color: #fff; border-color: var(--opg-tinta); padding: 1px 8px; font-size: 11px; }

/* ── Secciones y títulos ───────────────────────────────────────────────── */
.ta-seccion { display: flex; flex-direction: column; gap: var(--opg-espacio-4); }
.ta-titulo { font-family: var(--opg-fuente-titular); font-size: 20px; letter-spacing: .5px; color: var(--opg-ciruela); margin: 0; padding-bottom: 4px; border-bottom: 3px solid var(--opg-naranja); }
.ta-rotulo { font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--opg-morado-texto); }
.ta-ayuda { font-family: var(--opg-fuente-cuerpo); font-size: 11px; color: var(--opg-gris-texto); }
.ta-avisos, .ta-avisos-globales { display: flex; flex-direction: column; gap: var(--opg-espacio-2); }
.ta-avisos:empty, .ta-avisos-globales:empty { display: none; }
.ta-lista-avisos { margin: 0; padding-left: 18px; }

/* ── Tarjetas ───────────────────────────────────────────────────────────── */
.ta-tarjetas { display: flex; flex-direction: column; gap: var(--opg-espacio-4); }
.ta-grilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); }
.ta-card { text-align: left; }
.ta-cab { justify-content: space-between; flex-wrap: wrap; }
.ta-estado {
    font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; color: var(--opg-ciruela); background: #fff;
    border: 2px solid var(--opg-tinta); border-radius: 999px; padding: 2px 10px;
}
.ta-estado-aprobado { background: #d7f3e1; }
.ta-estado-denegado { background: #fadadd; }
.ta-estado-pendiente-narrador { background: #e8d9ff; }
.ta-estado-vencida { background: #e5e5e5; }
.ta-meta { font-family: var(--opg-fuente-cuerpo); font-size: 12px; color: var(--opg-marron); margin: 0; }
.ta-yo { font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 12px; color: var(--opg-morado-texto); margin: 0; }
.ta-datos { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-2) var(--opg-espacio-5); margin: 0; font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); }
.ta-datos div { flex: 0 1 auto; }
.ta-dato-ancho { flex-basis: 100% !important; }
.ta-datos dt { font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--opg-morado-texto); }
.ta-datos dd { margin: 0; }
.ta-nota { border-left: 4px solid var(--opg-naranja); background: #fff; border-radius: 0 var(--opg-radio-sm) var(--opg-radio-sm) 0; padding: 6px 10px; font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); }
.ta-nota b { font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--opg-morado-texto); }
.ta-nota p { margin: 2px 0 0; line-height: 1.45; }
.ta-nota-idea, .ta-nota-renuncia { border-left-color: var(--opg-morado); }
.ta-nota-error { border-left-color: var(--opg-rojo-error); }
.ta-enlace { margin: 0; font-family: var(--opg-fuente-cuerpo); font-size: 12px; }
.ta-enlace a:link, .ta-enlace a:visited { color: var(--opg-morado-texto); }
.ta-entrega { margin: 0; }
.ta-acciones { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-2); align-items: center; }

a.btn-op:link, a.btn-op:visited { color: #fff; text-decoration: none; }

/* ── Bloque destacado: aventuras sin narrador ───────────────────────────── */
.ta-sin-bloque { background: var(--opg-crema-clara); border: 3px solid var(--opg-tinta); border-radius: var(--opg-radio-md); box-shadow: var(--opg-sombra-offset); overflow: hidden; }
.ta-sin-cabecera { display: flex; align-items: center; justify-content: space-between; gap: var(--opg-espacio-3); background: var(--opg-morado-cta); color: #fff; padding: var(--opg-espacio-3) var(--opg-espacio-4); }
.ta-sin-cabecera h2 { margin: 0; font-family: var(--opg-fuente-titular); font-size: 22px; letter-spacing: 1px; color: #fff; text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black; }
.ta-sin-cifra { font-family: var(--opg-fuente-titular); font-size: 32px; line-height: 1; color: #fff; text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black; }
.ta-sin-cuerpo { display: flex; flex-direction: column; gap: var(--opg-espacio-4); padding: var(--opg-espacio-4); }
.ta-sin-intro { margin: 0; font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); }
.ta-ver-mas { display: flex; justify-content: center; }

/* ── Formularios ────────────────────────────────────────────────────────── */
.ta-form { gap: var(--opg-espacio-4); }
.ta-fila { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-3) var(--opg-espacio-4); align-items: flex-start; }
.ta-fila > * { flex: 1 1 220px; }
.ta-bloque { display: flex; flex-direction: column; gap: var(--opg-espacio-2); }
.ta-chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 8px; }
.ta-chip { font-size: 13px; }
.ta-chip small { opacity: .75; }
.ta-quitar { border: 0; background: none; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; color: var(--opg-rojo-error); }
.ta-casilla { display: flex; align-items: center; gap: 8px; font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); }
.ta-grupo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border: 0; margin: 0; padding: 0; min-width: 0; }
.ta-grupo legend { font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--opg-morado-texto); padding: 0; width: 100%; margin-bottom: 4px; }
.ta-radio { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ta-radio:checked + .ta-etiqueta-radio, .ta-filtro .ta-radio:checked + .opg-chip { background: var(--opg-naranja); color: #fff; }
.ta-radio:focus-visible + .ta-etiqueta-radio, .ta-filtro .ta-radio:focus-visible + .opg-chip { box-shadow: var(--opg-foco); }
.ta-filtro { cursor: pointer; }
.ta-filtros { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-3) var(--opg-espacio-5); align-items: flex-end; }
.ta-filtro-uid { max-width: 260px; }
.opg-resultados:empty { display: none; }
.ta-buscador .opg-buscar-caja { display: block; }
.ta-buscador input[type="search"] { width: 100%; }
.ta-sin-narrador { flex-basis: 100%; }
.ta-con-narrador { flex-basis: 100%; display: flex; flex-direction: column; gap: var(--opg-espacio-2); }
/* Los dos bloques de "¿Tienes narrador?" se alternan sin JavaScript. */
.ta-radio[value="0"]:checked ~ .ta-con-narrador { display: none; }
.ta-radio[value="1"]:checked ~ .ta-sin-narrador { display: none; }
/* Rol narrador: no hay selector de narrador ni chip del propio creador. */
.ta-switch:has(#ta-rol-n:checked) .ta-solo-jugador,
.ta-switch:has(#ta-rol-n:checked) .ta-chip-fijo { display: none; }
.ta-activas { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--opg-espacio-4); }
.ta-cifra { font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); }
.ta-cifra b { font-family: var(--opg-fuente-titular); font-size: 18px; color: var(--opg-ciruela); }
.ta-cifra-tope b { color: var(--opg-rojo-error); }
.ta-paginador { display: flex; align-items: center; justify-content: center; gap: var(--opg-espacio-3); margin-top: var(--opg-espacio-4); }
.ta-pagina { font-family: var(--opg-fuente-cuerpo); font-size: 12px; color: var(--opg-gris-texto); }


/* ── Consola: pestañas, filtros y filas ────────────────────────────────── */
.ca-tabs { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-2); border-bottom: 3px solid var(--opg-tinta); }
.ca-tab, a.ca-tab:link, a.ca-tab:visited {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 14px; color: var(--opg-ciruela); text-decoration: none;
    background: var(--opg-crema-clara); border: 2px solid var(--opg-tinta); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 8px 16px;
}
.ca-tab:hover { background: #ffd48a; }
.ca-tab-activa, a.ca-tab-activa:link, a.ca-tab-activa:visited { background: #ffa600; color: #fff; text-shadow: var(--opg-sombra-titular); }
.ca-contador, .opg-chip.ca-contador { background: var(--opg-morado-cta); color: #fff; border-color: var(--opg-tinta); padding: 1px 8px; font-size: 11px; }
.ca-oculto { display: none !important; }
.ca-seccion { display: flex; flex-direction: column; gap: var(--opg-espacio-4); }
.ca-titulo { font-family: var(--opg-fuente-titular); font-size: 20px; letter-spacing: .5px; color: var(--opg-ciruela); margin: 0; padding-bottom: 4px; border-bottom: 3px solid var(--opg-naranja); }
.ca-filtros { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-3) var(--opg-espacio-5); align-items: flex-end; }
.ca-grupo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border: 0; margin: 0; padding: 0; min-width: 0; }
.ca-grupo legend { font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--opg-morado-texto); padding: 0; width: 100%; margin-bottom: 4px; }
.ca-filtro { cursor: pointer; }
.ca-radio { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ca-radio:checked + .opg-chip { background: var(--opg-naranja); color: #fff; }
.ca-radio:focus-visible + .opg-chip { box-shadow: var(--opg-foco); }
.ca-uid { max-width: 220px; }
.ca-filas { display: flex; flex-direction: column; gap: var(--opg-espacio-3); }
.ca-fila { display: flex; flex-direction: column; gap: var(--opg-espacio-2); background: var(--opg-crema-clara); border: 3px solid var(--opg-tinta); border-radius: var(--opg-radio-md); box-shadow: var(--opg-sombra-offset); padding: var(--opg-espacio-3) var(--opg-espacio-4); text-align: left; }
.ca-fila-cab { display: flex; flex-wrap: wrap; align-items: center; gap: var(--opg-espacio-2) var(--opg-espacio-3); font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); }
.ca-id { font-family: var(--opg-fuente-titular); font-size: 18px; color: var(--opg-ciruela); }
.ca-isla { font-family: InterMedium, var(--opg-fuente-cuerpo); }
.ca-tier { font-family: InterMedium, var(--opg-fuente-cuerpo); color: var(--opg-morado-texto); }
.ca-chip-pequeno { padding: 1px 8px; font-size: 11px; }
.ca-datos { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-2) var(--opg-espacio-5); margin: 0; font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); }
.ca-dato-ancho { flex-basis: 100%; }
.ca-datos dt { font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--opg-morado-texto); }
.ca-datos dd { margin: 0; }
.ca-nota-staff { border-left-color: var(--opg-dorado); }
.ca-entrega { margin: 0; }
.ca-acciones { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-2); align-items: center; }
.ca-extra:empty { display: none; }
.ca-extra { border-top: 2px dashed var(--opg-tinta); padding-top: var(--opg-espacio-3); }
.ca-form { display: flex; flex-direction: column; gap: var(--opg-espacio-3); }
.ca-fila-campos { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-3) var(--opg-espacio-4); align-items: flex-start; }
.ca-fila-campos > * { flex: 1 1 220px; }
.ca-fila-campos .af-field--ancho-completo { flex-basis: 100%; }
.ca-historial-cab { display: flex; justify-content: space-between; align-items: center; gap: var(--opg-espacio-3); font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-ciruela); }
.ca-historial-lista { margin: 0; padding-left: 18px; font-family: var(--opg-fuente-cuerpo); font-size: 12px; color: var(--opg-marron); display: flex; flex-direction: column; gap: 6px; }
.ca-hist-fecha { color: var(--opg-gris-texto); }

/* ── Ventana de confirmación (sin JavaScript) ───────────────────────────── */
.ta-modal-velo { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: var(--opg-espacio-4); background: rgba(26, 20, 35, .72); }
.ta-velo-cerrar { position: absolute; inset: 0; border: 0; background: transparent; cursor: pointer; }
.ta-modal { position: relative; z-index: 1; width: 100%; max-width: 560px; max-height: 90vh; overflow: auto; display: flex; flex-direction: column; gap: var(--opg-espacio-3); text-align: left;
    background: var(--opg-crema-clara); border: 3px solid var(--opg-tinta); border-radius: var(--opg-radio-md); box-shadow: var(--opg-sombra-offset); padding: var(--opg-espacio-5); }
.ta-modal h3 { margin: 0; font-family: var(--opg-fuente-titular); font-size: 20px; color: var(--opg-ciruela); }
.ta-modal p { margin: 0; font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); line-height: 1.5; }

@media (max-width: 700px) {
    .ca-consola .secondBackground, .ca-consola .thirdBackground { padding: 10px; }
    .ta-titulo-pagina .barra-texto-op { font-size: 20px; }
    .ta-sin-cabecera h2 { font-size: 18px; }
    .ta-tab, a.ta-tab:link, a.ta-tab:visited { padding: 8px 10px; font-size: 13px; }
}
</style>

<body hx-headers='{"X-Post-Key":"{$post_key}"}'>
{$header}
<div class="indice ca-consola">
<div class="mainBackground">
<div class="secondBackground">
<div class="thirdBackground">

    <div>
        <div class="barra-op bbox ta-titulo-pagina"><span class="barra-texto-op">Consola de aventuras</span></div>
        <div class="barra-espacio-op bbox ta-descripcion">
            Aprueba, deniega y finaliza solicitudes, corrige sus datos, revisa las entregas de los narradores y modera las ofertas de narrador.
        </div>
    </div>

    <div class="ta-avisos-globales" id="ta-avisos" aria-live="polite"></div>

    {$tabs_html}

    <div id="ca-panel">{$panel_html}</div>

</div>
</div>
</div>
</div>
<script src="{$htmx_url}" defer></script>
{$footer}
