<style>
.item-outer .tooltip{position:static!important}
.opg-tip-toggle{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);border:1px solid #666;color:#ddd;font-size:10px;padding:2px 6px;cursor:pointer;border-radius:3px;line-height:1.4;white-space:nowrap;z-index:1}
.opg-tip-toggle:hover{background:rgba(255,255,255,.15)}
</style>
<script>
(function(){
  var KEY='opg_tip_side';
  function isIzq(){return localStorage.getItem(KEY)==='izq';}

  function positionTip(tip,outer){
    var r=outer.getBoundingClientRect();
    var sx=window.scrollX!==undefined?window.scrollX:window.pageXOffset;
    var sy=window.scrollY!==undefined?window.scrollY:window.pageYOffset;
    tip.style.setProperty('top',   (r.bottom+sy)+'px','important');
    tip.style.setProperty('bottom','auto',             'important');
    if(isIzq()){
      tip.style.setProperty('left',     (r.left+sx)+'px','important');
      tip.style.setProperty('right',    'auto',           'important');
      tip.style.setProperty('transform','none',           'important');
    }else{
      tip.style.setProperty('left',     (r.right+sx)+'px',  'important');
      tip.style.setProperty('right',    'auto',              'important');
      tip.style.setProperty('transform','translateX(-100%)','important');
    }
  }

  function updateBtns(){
    var izq=isIzq();
    document.querySelectorAll('.opg-tip-toggle').forEach(function(b){
      b.textContent=izq?'▶':'◀';
      b.title=izq?'Mover a la derecha':'Mover a la izquierda';
    });
  }

  function portalTip(tip,outer){
    if(tip._opgP)return;
    tip._opgP=true; tip._opgOuter=outer;
    document.body.appendChild(tip);
    tip.style.setProperty('position','absolute','important');
    tip.style.setProperty('z-index', '9999',    'important');
    tip.style.setProperty('display', 'none',    'important');
    if(!tip.querySelector('.opg-tip-toggle')){
      var btn=document.createElement('button');
      btn.type='button'; btn.className='opg-tip-toggle';
      btn.onclick=function(e){
        e.stopPropagation();
        localStorage.setItem(KEY,isIzq()?'der':'izq');
        updateBtns();
        positionTip(tip,outer);
      };
      tip.appendChild(btn);
    }
    updateBtns();
  }

  document.addEventListener('mouseover',function(e){
    var outer=e.target.closest&&e.target.closest('.item-outer');
    if(!outer)return;
    var tip=outer._opgTip||(outer._opgTip=outer.querySelector('.tooltiptext.item-tooltip'));
    if(!tip)return;
    portalTip(tip,outer);
    positionTip(tip,outer);
    tip.style.setProperty('display','block','important');
  });

  document.addEventListener('mouseout',function(e){
    var outer=e.target.closest&&e.target.closest('.item-outer');
    if(!outer||!outer._opgTip)return;
    var to=e.relatedTarget;
    if(to&&(outer.contains(to)||outer._opgTip.contains(to)))return;
    outer._opgTip.style.setProperty('display','none','important');
  });

  document.addEventListener('mouseout',function(e){
    var tip=e.target.closest&&e.target.closest('.tooltiptext.item-tooltip');
    if(!tip||!tip._opgOuter)return;
    var to=e.relatedTarget;
    if(to&&(tip.contains(to)||tip._opgOuter.contains(to)))return;
    tip.style.setProperty('display','none','important');
  });

  document.addEventListener('DOMContentLoaded',updateBtns);
}());
</script>
