<html>

<head>
    <style>
		.entrenamiento p {
			font-size: 21px;	
		}
		
		.poneglyph {
			display: flex;flex-direction: row;background: url(/images/op/uploads/PoneglyphEntrenamientoAprendizaje_One_Piece_Gaiden_Foro_Rol.png);height: 380px;background-size: contain;
		}
		
		.texto-top {
			text-align: center; font-family: InterRegular; color: white; text-shadow: 1px 1px 2px black; margin-top: 17px; margin-bottom: 3px; font-size: 20px;
		}
		
		.entreno-button {
			background-color: #d16f19 !important;
			transition: all 0.5s ease-out;
			font-size: 18px !important;
			border: 1px solid black !important;
			font-family: InterRegular !important;
		}
		
		.entreno-acciones {
			display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 16px;
		}

		.entreno-acciones .entreno-button {
			padding: 10px 20px; border-radius: 8px; color: white; cursor: pointer; text-shadow: 1px 1px 1px black;
		}

		.entreno-acciones .entreno-button:disabled {
			opacity: .6; cursor: default;
		}

		.entreno-button:hover {
			background-color: #df7416 !important;
		}

    </style>
    <title>One Piece Gaiden</title>
    {$headerinclude}
</head>

<body>
    {$header}
    <div class="indice">
		<div class="mainBackground">
			<div class="secondBackground">
				<div class="thirdBackground">
					<div id="entreno-page">
						<div style="margin-bottom: 10px;">
							<img src="/images/op/uploads/EntrenamientoIntensivo_One_Piece_Gaiden_Foro_Rol.jpg" />
						</div>
						<div style="display: none">
							<form id="form" method="post" action="oficios.php">
								<input type="hidden" name="my_post_key" value="{$mybb->post_code}">
								<input type="text" name="culminar" id="culminar" value="1">
								<input type="hidden" name="reentrenar" id="reentrenar" value="0">
							</form>
						</div>
						<div style="position: relative;margin-top: 120px;">

							<div id="luffy-running" style="position: absolute;top: -141px;left: 418px;">
								<img src="/images/op/uploads/LuffyGif.gif" />
							</div>

							<div style=" width: 996px; height: 35px; background-color: #ff7600; border: 2px solid black; border-radius: 3px; margin-bottom: 10px; ">

							</div>

							<div style="position: absolute;color: white;top: 4px;left: 423px;font-family: InterRegular;font-size: 22px;text-shadow: 1px 1px 4px black;">¡Completado!</div>
						</div>
						<div class="poneglyph">
						<div style=" margin: 0 auto; ">
							<div class="texto-top">¡Felicidades!<br>¡Has ganado {$recompensa} puntos de oficio!</div>
							<div id="myGif"><img style="border: 2px solid black; " src="/images/op/uploads/PuntosOficioCompletados_One_Piece_Gaiden_Foro_Rol.gif" /></div>
						</div>
					</div>
					<div class="entreno-acciones">
						<button class="entreno-button" type="button" onclick="enviarCulminar(false);">Completar Lección</button>
						<button class="entreno-button" type="button" onclick="enviarCulminar(true);">Completar y seguir con otra lección</button>
					</div>
					</div>
				</div>
			</div>
		 </div>
	  </div>
	<script>
		// Un solo envio: los botones se desactivan al pulsar (el servidor tambien evita el doble cobro).
		function enviarCulminar(reentrenar) {
			document.getElementById('reentrenar').value = reentrenar ? '1' : '0';
			var botones = document.querySelectorAll('.entreno-button');
			for (var i = 0; i < botones.length; i++) { botones[i].disabled = true; }
			document.getElementById('form').submit();
		}
	</script>
    {$reload_script}
    {$footer}
</body>

</html>
