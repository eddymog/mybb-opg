<html>

<head>
    <title>Consola de staff</title>
    {$headerinclude}
    <!-- fontawesome+solid, no all.min.css: ese bundle trae los shims de v4
         (clase "fa" sola) y hace que los <i class="fa fa-..."> del menú del
         header (normalmente sin estilo en el resto del foro) se vean como
         iconos acá. Ver docs/style.md §7. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/fontawesome.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/solid.min.css" crossorigin="anonymous" />
    <!-- opg-tokens.css ya lo carga headerinclude (ver docs/style.md §7) -->
    <style>
    /* Marco de tres fondos (op_global.css) con ancho fluido en vez de 1030px fijos */
    /* text-align: el body del tema (global.css) centra todo el texto */
    .consola .thirdBackground { width: 100%; max-width: 1030px; gap: var(--opg-espacio-6); text-align: left; }

    /* ── Cabecera: título, saludo, rol y buscador fijo ─────────────────────── */
    .consola-cabecera {
        position: sticky; top: 0; z-index: 10;
        /* Halftone sobre el naranja (ver style.md §7): un elemento, sin ancestro
           sticky de por medio, así que no choca con nada. */
        background: var(--opg-textura-trama), var(--opg-naranja);
        border: 2px solid var(--opg-tinta); border-radius: var(--opg-radio-md);
        box-shadow: var(--opg-sombra-offset); padding: var(--opg-espacio-3) var(--opg-espacio-4);
        display: flex; flex-wrap: wrap; align-items: center; gap: var(--opg-espacio-3) var(--opg-espacio-4);
    }
    .consola-titulo {
        margin: 0; font-family: var(--opg-fuente-titular); font-weight: normal; font-size: 22px; letter-spacing: 1px; color: #fff;
        text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black, 2px 2px 0 black;
    }
    .consola-usuario { margin-left: auto; display: flex; align-items: center; gap: var(--opg-espacio-2); font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-ciruela); }
    .consola-rol {
        font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
        color: #fff; background: var(--opg-ciruela); border: 2px solid var(--opg-tinta); border-radius: 999px; padding: 1px 8px;
    }
    .consola-buscar-caja { flex: 1 1 100%; position: relative; }
    .consola-buscar-caja .fa-magnifying-glass { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--opg-gris-texto); font-size: 13px; }
    .consola-buscar {
        width: 100%; box-sizing: border-box; font-family: var(--opg-fuente-cuerpo); font-size: 14px; color: var(--opg-marron);
        background: #fff; border: 2px solid var(--opg-tinta); border-radius: var(--opg-radio-sm); padding: 8px 40px 8px 34px;
    }
    .consola-buscar::placeholder { color: var(--opg-gris-texto); }
    .consola-atajo {
        position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
        font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; color: var(--opg-gris-texto);
        border: 1px solid var(--opg-gris-texto); border-radius: 4px; padding: 0 6px; line-height: 18px;
    }

    /* ── Grupos: título con raya de acento, sin caja propia ────────────────── */
    .grupo-titulo {
        display: inline-block; margin: 0 0 var(--opg-espacio-4); font-family: var(--opg-fuente-titular); font-weight: normal;
        font-size: 18px; letter-spacing: 1px; text-transform: uppercase; color: var(--opg-ciruela);
        padding-bottom: 4px; border-bottom: 5px solid var(--opg-card-acento, var(--opg-naranja));
    }
    .grid-herramientas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: var(--opg-espacio-5); }

    .herramienta-acciones { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: var(--opg-espacio-1); }
    .herramienta-ir {
        margin-top: auto; padding-top: var(--opg-espacio-1); align-self: flex-end;
        font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 12px; color: var(--opg-morado-texto);
    }
    .herramienta-ir .fa-arrow-right { transition: transform var(--opg-rapido); }
    a.herramienta:hover .herramienta-ir .fa-arrow-right { transform: translateX(3px); }

    .sin-resultados { display: none; text-align: center; font-family: var(--opg-fuente-cuerpo); color: var(--opg-gris-texto); font-style: italic; margin: 0; }

    @media (max-width: 700px) {
        .consola .secondBackground, .consola .thirdBackground { padding: 10px; }
        .consola-usuario { margin-left: 0; }
    }
    </style>
</head>

<body>
    {$header}
    <div class="indice consola">
    <div class="mainBackground">
    <div class="secondBackground">
    <div class="thirdBackground">

        <div class="consola-cabecera">
            <h1 class="consola-titulo">Consola de staff</h1>
            <div class="consola-usuario">Hola, {$consola_usuario} <span class="consola-rol">{$consola_rol}</span></div>
            <div class="consola-buscar-caja">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" id="consola-buscar" class="consola-buscar" placeholder="Buscar herramienta… (akumas, salario, log)" autocomplete="off" aria-label="Buscar herramienta">
                <kbd class="consola-atajo" title="Pulsa / para buscar">/</kbd>
            </div>
        </div>

        {$consola_secciones}

        <p class="sin-resultados" id="consola-sin-resultados">Ninguna herramienta coincide con la búsqueda.</p>

    </div>
    </div>
    </div>
    </div>
    {$footer}

    <script>
    (function () {
        var campo = document.getElementById('consola-buscar');
        var vacio = document.getElementById('consola-sin-resultados');
        var normalizar = function (t) { return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); };

        campo.addEventListener('input', function () {
            var q = normalizar(campo.value.trim());
            var alguno = false;
            document.querySelectorAll('.consola .grupo').forEach(function (grupo) {
                var visibles = 0;
                grupo.querySelectorAll('[data-buscar]').forEach(function (el) {
                    // Por inicio de palabra: "log" encuentra "Log de consola" pero no "catálogo".
                    var ok = q === '' || (' ' + normalizar(el.getAttribute('data-buscar')).replace(/[^a-z0-9]+/g, ' ')).indexOf(' ' + q) !== -1;
                    el.style.display = ok ? '' : 'none';
                    if (ok) visibles++;
                });
                grupo.style.display = visibles ? '' : 'none';
                if (visibles) alguno = true;
            });
            vacio.style.display = alguno ? 'none' : 'block';
        });

        // "/" enfoca el buscador (salvo que ya estés escribiendo en otro campo); Esc lo limpia.
        document.addEventListener('keydown', function (ev) {
            var enCampo = ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(ev.target.tagName) !== -1 || ev.target.isContentEditable;
            if (ev.key === '/' && !enCampo) { ev.preventDefault(); campo.focus(); campo.select(); }
            if (ev.key === 'Escape' && ev.target === campo) { campo.value = ''; campo.dispatchEvent(new Event('input')); campo.blur(); }
        });
    })();
    </script>
</body>

</html>
