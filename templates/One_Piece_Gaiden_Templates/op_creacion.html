<html>

<head>
    <style>
		.poneglyph {
			display: grid !important;
			grid-template-columns: 94px 94px !important;
			grid-template-rows: 94px 94px !important;
			gap: 14px !important;
			justify-content: center !important;
			align-content: center !important;
			background: url(/images/op/uploads/PoneglyphEntrenamientoAprendizaje_One_Piece_Gaiden_Foro_Rol.png);
			height: 380px;
			background-size: contain;
		}

		.creacion-card {
			width: 94px !important;
			height: 94px !important;
			margin: 0 !important;
			background: rgba(0,0,0,0.35) !important;
			border: 1px solid black !important;
			border-radius: 6px !important;
			display: block !important;
			position: relative !important;
			cursor: pointer !important;
			overflow: hidden !important;
			transition: transform 0.15s ease !important;
			grid-column: auto !important;
			grid-row: auto !important;
		}

		.creacion-card:hover {
			transform: translateY(-2px) !important;
		}

		.creacion-imagen {
			position: absolute !important;
			top: 0 !important;
			left: 0 !important;
			width: 100% !important;
			height: 100% !important;
			object-fit: contain !important;
			display: block !important;
			padding: 9px !important;
			box-sizing: border-box !important;
		}

		.creacion-nombre-hover {
			position: absolute !important;
			top: 0 !important;
			left: 0 !important;
			right: 0 !important;
			bottom: 0 !important;
			background: rgba(0,0,0,0.8) !important;
			color: #fff !important;
			display: flex !important;
			align-items: center !important;
			justify-content: center !important;
			text-align: center !important;
			font-size: 11px !important;
			font-weight: bold !important;
			padding: 5px !important;
			box-sizing: border-box !important;
			opacity: 0 !important;
			visibility: hidden !important;
			transition: opacity 0.2s ease !important;
			pointer-events: none !important;
			z-index: 2 !important;
		}

		.creacion-card:hover .creacion-nombre-hover {
			opacity: 1 !important;
			visibility: visible !important;
		}

		.creacion-crear-bar {
			position: absolute !important;
			left: 0 !important;
			right: 0 !important;
			bottom: 0 !important;
			background: rgba(232,98,0,0.92) !important;
			color: #fff !important;
			font-weight: bold !important;
			text-align: center !important;
			padding: 4px 0 !important;
			font-size: 11px !important;
			letter-spacing: 0.3px !important;
			pointer-events: none !important;
			z-index: 1 !important;
		}

		.creacion-modal-overlay {
			display: none;
			position: fixed;
			top: 0; right: 0; bottom: 0; left: 0;
			background: rgba(0,0,0,0.7);
			z-index: 9999;
			align-items: center;
			justify-content: center;
		}

		.creacion-modal-overlay.activo { display: flex; }

		.creacion-modal-box {
			background: #1a1228;
			border: 2px solid #4a2d6e;
			border-radius: 10px;
			padding: 26px 30px;
			max-width: 360px;
			width: 90%;
			text-align: center;
			color: #eee;
			font-family: InterRegular;
		}

		.creacion-modal-box h3 {
			margin: 0 0 12px;
			color: #ffe080;
			font-size: 18px;
		}

		.creacion-modal-costo {
			font-size: 14px;
			color: #f0dfc0;
			margin-bottom: 20px;
		}

		.creacion-modal-botones {
			display: flex;
			gap: 12px;
			justify-content: center;
		}

		.creacion-modal-botones button {
			font-size: 15px;
			font-family: InterRegular;
			border: 2px solid black;
			color: white;
			border-radius: 8px;
			padding: 8px 18px;
			cursor: pointer;
			transition: all 0.2s ease-out;
		}

		.creacion-modal-cancelar { background-color: #555; }
		.creacion-modal-cancelar:hover { background-color: #777; }
		.creacion-modal-confirmar { background-color: #e86200; }
		.creacion-modal-confirmar:hover { background-color: #9151b5; }

    </style>
    <title>Creaciones</title>
    {$headerinclude}
</head>

<body>
    {$header}
	  <div class="indice">
		<div class="mainBackground">
			<div class="secondBackground">
				<div class="thirdBackground">
					<div style="margin-bottom: 10px;">
						<img src="/images/op/uploads/NuevasPosibilidades_One_Piece_Gaiden_Foro_Rol.jpg" />
					</div>

					<div class="poneglyph">
						{$g_creacion_botones}
					</div>
				</div>
			</div>
		 </div>
	  </div>
	<if $log_var !='' then><script>alert(`{$log_var}`);</script></if>

	<div id="creacion-modal" class="creacion-modal-overlay">
		<div class="creacion-modal-box">
			<h3 id="creacion-modal-nombre"></h3>
			<div class="creacion-modal-costo" id="creacion-modal-costo"></div>
			<div class="creacion-modal-botones">
				<button type="button" class="creacion-modal-cancelar" onclick="cerrarModalCreacion()">Cancelar</button>
				<button type="button" class="creacion-modal-confirmar" onclick="confirmarModalCreacion()">Confirmar</button>
			</div>
		</div>
	</div>

	<script>
	// Los costes no viven aquí: el backend (creacion.php) construye este HTML con el texto
	// ya calculado y valida todo de nuevo al recibir accion=crear. Este script sólo muestra
	// el modal y redirige al confirmar; no decide si el usuario puede permitírselo.
	var creacionSeleccionada = null;

	function abrirModalCreacion(ticketId, nombre, costoTexto) {
		creacionSeleccionada = ticketId;
		document.getElementById('creacion-modal-nombre').textContent = nombre;
		document.getElementById('creacion-modal-costo').textContent = 'Coste: ' + costoTexto;
		document.getElementById('creacion-modal').classList.add('activo');
	}

	function cerrarModalCreacion() {
		document.getElementById('creacion-modal').classList.remove('activo');
		creacionSeleccionada = null;
	}

	function confirmarModalCreacion() {
		if (!creacionSeleccionada) return;
		window.location.href = '/op/creacion.php?accion=crear&ticket=' + creacionSeleccionada;
	}

	document.getElementById('creacion-modal').addEventListener('click', function(e) {
		if (e.target === this) cerrarModalCreacion();
	});
	</script>
	{$reload_script}
	{$footer}
</body>

</html>
