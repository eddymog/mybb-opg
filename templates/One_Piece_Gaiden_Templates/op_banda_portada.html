<div id="banda-portada" style="display:block;">
  <div style="display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:30px; padding:30px 40px 50px;">

    <!-- Columna izquierda: bandera -->
    <div style="display:flex; justify-content:flex-end; align-items:center;">
      <if $banda['bandera'] != '' then>
        <img src="{$banda['bandera']}"
             style="max-width:200px; max-height:320px;
                    border:4px solid {$borderColor};
                    border-radius:6px;
                    box-shadow:0 0 20px rgba(0,0,0,0.65);" />
      </if>
    </div>

    <!-- Columna central: retrato del capitán -->
    <div style="text-align:center;">
      <div style="width:280px; height:380px; overflow:hidden;
                  border:4px solid {$borderColor}; border-radius:8px;
                  box-shadow:0 0 30px rgba(0,0,0,0.7); margin:0 auto;">
        <img src="{$avatar_capitan}"
             style="width:100%; height:100%; object-fit:cover; object-position:top;" />
      </div>
      <div style="margin-top:12px;">
        <a href="/member.php?action=profile&uid={$owner_uid}"
           style="font-family:'moonGetHeavy'; color:white; font-size:20px;
                  text-shadow:2px 2px 4px black; letter-spacing:1px;
                  text-decoration:none;">
          {$nombre_capitan}
        </a>
      </div>
    </div>

    <!-- Columna derecha: vacía (reservada) -->
    <div></div>

  </div>
</div>
