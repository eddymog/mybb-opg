<style>
/* ── Marco de la página ─────────────────────────────────────────────────── */
/* text-align: el body del tema centra todo el texto (style.md, sección 7) */

.ta-encabezado-icono { display: inline-grid; flex: 0 0 38px; width: 38px; height: 38px; place-items: center; box-sizing: border-box; border: 2px solid var(--opg-tinta); border-radius: 6px; background: var(--opg-naranja); color: #fff; font-size: 18px; }
.ta-encabezado h1 { flex: 1 1 auto; min-width: 0; margin: 0; font-family: var(--opg-fuente-titular); font-size: 28px; line-height: 1.1; color: var(--opg-ciruela); }
.ta-oculto { display: none !important; }
.htmx-request { opacity: .75; }

/* ── Consulta de otro personaje ────────────────────────────────────────── */
.ta-selector-vista { position: relative; flex: 0 0 auto; }
.ta-selector-vista > summary { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; box-sizing: border-box; padding: 7px 12px; border: 2px solid var(--opg-tinta); border-radius: 4px; background: var(--opg-morado-cta); color: #fff; cursor: pointer; list-style: none; font: 12px/1.2 InterMedium, var(--opg-fuente-cuerpo); }
.ta-selector-vista > summary::-webkit-details-marker { display: none; }
.ta-selector-vista > summary:hover, .ta-selector-vista[open] > summary { background: var(--opg-morado-texto); }
.ta-selector-vista-panel { position: absolute; z-index: 12; top: calc(100% + 7px); right: 0; width: 300px; box-sizing: border-box; padding: 10px; border: 2px solid var(--opg-tinta); border-radius: 6px; background: var(--opg-crema-clara); box-shadow: 3px 3px 0 var(--opg-tinta); }
.ta-selector-vista-panel small { display: block; margin: 5px 2px 0; color: var(--opg-gris-texto); font: 9px/1.3 var(--opg-fuente-cuerpo); }
.ta-selector-vista-busqueda { position: relative; min-width: 0; }

.ta-selector-vista input[type="search"] { display: block; width: 100%; max-width: none; min-height: 38px; box-sizing: border-box; margin: 0; padding: 7px 10px 7px 32px; border: 2px solid var(--opg-tinta); border-radius: 4px; background: #fff; color: var(--opg-ciruela); font: 11px/1.3 var(--opg-fuente-cuerpo); }
.ta-selector-vista input[type="search"]::placeholder { color: var(--opg-gris-texto); opacity: 1; }
.ta-resultados-vista { width: 100%; box-sizing: border-box; overflow: hidden; margin-top: 7px; border-radius: 4px; background: #fff; }
.ta-resultados-vista:empty { display: none; }
.ta-resultado-vista, a.ta-resultado-vista:link, a.ta-resultado-vista:visited { display: flex; justify-content: space-between; gap: 12px; padding: 8px 10px; border: 1px solid var(--opg-gris-bloqueado); color: var(--opg-ciruela); font: 12px/1.3 var(--opg-fuente-cuerpo); text-decoration: none; }
.ta-resultado-vista span { color: var(--opg-gris-texto); font-size: 10px; white-space: nowrap; }
.ta-modo-vista { display: grid; gap: var(--opg-espacio-4); }
.ta-modo-vista-cabecera { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 12px; border-bottom: 3px solid var(--opg-naranja); }
.ta-modo-vista-cabecera span { display: inline-flex; align-items: center; gap: 6px; color: var(--opg-morado-texto); font: 11px/1.3 InterMedium, var(--opg-fuente-cuerpo); text-transform: uppercase; }
.ta-modo-vista-cabecera h2 { margin: 3px 0 0; color: var(--opg-ciruela); font: 22px/1.15 var(--opg-fuente-titular); }

/* ── Pestañas ───────────────────────────────────────────────────────────── */
.ta-tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: hidden; border: 2px solid var(--opg-tinta); border-radius: 6px; background: var(--opg-crema-clara); }
.ta-tab, a.ta-tab:link, a.ta-tab:visited {
    display: inline-flex; align-items: center; gap: 8px;
    position: relative; justify-content: center; text-align: center; min-height: 44px; box-sizing: border-box;
    padding: 7px 10px 9px; background: var(--opg-crema-clara);
    font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-ciruela); text-decoration: none;
    transition: background var(--opg-rapido), color var(--opg-rapido);
}
.ta-tab + .ta-tab { border-left: 2px solid var(--opg-tinta); }
.ta-tab i { display: inline-flex; flex: 0 0 18px; width: 18px; align-items: center; justify-content: center; color: var(--opg-morado-texto); font-size: 17px; line-height: 1; }

.ta-tab-activa, a.ta-tab-activa:link, a.ta-tab-activa:visited { background: #fff; color: var(--opg-ciruela); box-shadow: inset 0 -4px 0 var(--opg-naranja); }
.ta-tab-activa i { color: var(--opg-naranja); }
.ta-tab.ta-tab-cargando { background: #fff; box-shadow: inset 0 -4px 0 var(--opg-naranja); }
.ta-tab.ta-tab-cargando i { color: var(--opg-naranja); }
.ta-contador, .opg-chip.ta-contador { flex: 0 0 auto; white-space: nowrap; background: var(--opg-morado-cta); color: #fff; border-color: var(--opg-tinta); padding: 1px 8px; font-size: 11px; }
.ta-panel-cargando { display: none; height: 3px; overflow: hidden; border-radius: 3px; background: rgba(115, 22, 190, .18); }
.ta-panel-cargando::after { content: ""; display: block; width: 38%; height: 100%; background: var(--opg-morado-cta); animation: ta-cargando 850ms ease-in-out infinite; }

.ta-tabs-cargando #ta-panel { opacity: .72; transition: opacity var(--opg-rapido); }
@keyframes ta-cargando { from { transform: translateX(-105%); } to { transform: translateX(365%); } }
@media (prefers-reduced-motion: reduce) { .ta-panel-cargando::after { width: 100%; animation: none; } }

/* ── Secciones y títulos ───────────────────────────────────────────────── */
.ta-seccion { display: flex; flex-direction: column; gap: var(--opg-espacio-4); }
.ta-titulo { font-family: var(--opg-fuente-titular); font-size: 20px; letter-spacing: 0; color: var(--opg-ciruela); margin: 0; padding-bottom: 8px; border-bottom: 3px solid var(--opg-naranja); }
.ta-rotulo { font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 12px; letter-spacing: 0; color: var(--opg-morado-texto); }
.ta-ayuda { font-family: var(--opg-fuente-cuerpo); font-size: 11px; color: var(--opg-gris-texto); }
.ta-avisos, .ta-avisos-globales { display: flex; flex-direction: column; gap: var(--opg-espacio-2); }
.ta-avisos:empty, .ta-avisos-globales:empty { display: none; }
.ta-lista-avisos { margin: 0; padding-left: 18px; }

/* ── Tarjetas ───────────────────────────────────────────────────────────── */
.ta-tarjetas { display: flex; flex-direction: column; gap: var(--opg-espacio-4); }
.ta-grilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
.ta-card { text-align: left; padding: 16px 14px 12px; gap: 6px; }
.ta-cab { justify-content: space-between; flex-wrap: wrap; }
.ta-estado {
    font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; color: var(--opg-ciruela); background: #fff;
    border: 2px solid var(--opg-tinta); border-radius: 999px; padding: 2px 10px;
}
.ta-estado-aprobado { background: #d7f3e1; }
.ta-estado-denegado { background: #fadadd; }
.ta-estado-pendiente-narrador { background: #e8d9ff; }

.ta-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-family: var(--opg-fuente-cuerpo); font-size: 12px; color: var(--opg-marron); margin: 0; }
.ta-meta > span:not(.opg-chip) { display: inline-flex; align-items: center; gap: 5px; }
.ta-meta i { color: var(--opg-morado-texto); }
.ta-yo { font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 12px; color: var(--opg-morado-texto); margin: 0; }
.ta-datos { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-2) var(--opg-espacio-5); margin: 0; font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); }
.ta-datos div { flex: 0 1 auto; }
.ta-dato-ancho { flex-basis: 100% !important; }
.ta-datos dt { font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 12px; letter-spacing: 0; color: var(--opg-morado-texto); }
.ta-datos dd { margin: 0; }
.ta-nota { border-left: 4px solid var(--opg-naranja); background: #fff; border-radius: 0 var(--opg-radio-sm) var(--opg-radio-sm) 0; padding: 6px 10px; font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); }
.ta-nota b { font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 12px; letter-spacing: 0; color: var(--opg-morado-texto); }
.ta-nota p { margin: 2px 0 0; line-height: 1.45; }
.ta-descripcion { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.ta-descripcion-control { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ta-nota-comentario { width: 100%; box-sizing: border-box; }
.ta-nota-comentario p { display: -webkit-box; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
.ta-descripcion-control:checked + .ta-nota p { display: block; overflow: visible; -webkit-line-clamp: unset; }
.ta-descripcion-toggle { cursor: pointer; border: 0; background: none; padding: 2px 0; font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; color: var(--opg-morado-texto); text-decoration: underline; }
.ta-descripcion-menos { display: none; }
.ta-descripcion-control:checked ~ .ta-descripcion-toggle .ta-descripcion-mas { display: none; }
.ta-descripcion-control:checked ~ .ta-descripcion-toggle .ta-descripcion-menos { display: inline; }
.ta-descripcion-control:focus-visible ~ .ta-descripcion-toggle { outline: 3px solid var(--opg-morado); outline-offset: 3px; }
.ta-nota-idea, .ta-nota-renuncia { border-left-color: var(--opg-morado); }
.ta-nota-error { border-left-color: var(--opg-rojo-error); }
.ta-enlace { margin: 0; font-family: var(--opg-fuente-cuerpo); font-size: 12px; }
.ta-enlace a:link, .ta-enlace a:visited { color: var(--opg-morado-texto); }
.ta-entrega { margin: 0; }
.ta-acciones { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-2); align-items: center; padding-top: 2px; }
.ta-accion-principal { display: inline-flex; align-items: center; gap: 7px; letter-spacing: 0; }
.ta-mas-acciones { position: relative; }
.ta-mas-acciones > summary { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; border: 1px solid var(--opg-tinta); border-radius: 4px; background: #fff; padding: 5px 9px; font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 12px; color: var(--opg-ciruela); }
.ta-mas-acciones > summary::-webkit-details-marker { display: none; }
.ta-mas-acciones[open] > summary { background: #eee5ff; }
.ta-mas-acciones > div { z-index: 4; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.ta-mas-acciones .opg-chip { display: inline-flex; align-items: center; gap: 5px; }
.ta-resaltada { outline: 4px solid var(--opg-dorado); outline-offset: 2px; }
.ta-inframundo { padding: 1px 8px; font-size: 11px; }
.ta-datos-incompletos { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; font-size: 11px; color: var(--opg-marron); background: #ece8e2; border-color: var(--opg-gris-texto); }
.ta-solo-lector { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
.ta-discord { font-family: var(--opg-fuente-cuerpo); font-size: 13px; margin: 0; color: var(--opg-marron); }
.ta-copiable { user-select: all; background: #fff; border: 1px solid var(--opg-tinta); border-radius: 4px; padding: 0 6px; }
.ta-etiquetas-narrador { display: flex; flex-wrap: wrap; gap: 6px; }
.ta-etiqueta-narrador { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; font-size: 11px; background: #fff; }
.ta-etiqueta-disponible, .ta-estado-disponible { background: #d7f3e1; border-color: var(--opg-verde-exito); }
.ta-etiqueta-carga { background: #eee5ff; border-color: var(--opg-morado); }
.ta-etiqueta-experiencia { background: #f1f1f1; border-color: var(--opg-gris-texto); }
.ta-narradores-cabecera { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.ta-narradores-cabecera > div { flex: 1 1 auto; min-width: 0; }
.ta-narradores-cabecera .ta-ayuda { margin: 6px 0 0; }

.ta-mi-oferta-card { padding: 11px 12px; gap: 8px; }
.ta-mi-oferta-resumen { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px 20px; align-items: end; }
.ta-mi-oferta-info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; min-width: 0; }
.ta-mi-oferta-info .opg-card__desc { flex: 1 1 260px; margin: 0; }
.ta-mi-oferta-info .ta-etiquetas-narrador { flex: 1 0 100%; }
.ta-mi-oferta-card .ta-acciones { justify-content: flex-end; padding: 0; }
.ta-mi-oferta-card .ta-acciones .opg-chip { display: inline-flex; align-items: center; gap: 5px; }
.ta-narradores-lista { grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 420px)); justify-content: start; gap: 10px; }
.ta-narrador { min-height: 0; padding: 10px 12px; gap: 5px; }
.ta-narrador .opg-card__titulo { font-size: 16px; }
.ta-narrador .opg-card__desc { margin: 1px 0; font-size: 12px; line-height: 1.35; }
.ta-narrador-pie { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 5px 12px; margin-top: auto; }
.ta-narrador-pie .ta-meta, .ta-narrador-pie .ta-discord { margin: 0; font-size: 11px; }
.ta-tiers-preferidos { margin: 0; padding: 0; border: 0; min-width: 0; }
.ta-tiers-preferidos legend { margin-bottom: 7px; font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 12px; color: var(--opg-morado-texto); }
.ta-tiers-preferidos > div { display: flex; flex-wrap: wrap; gap: 6px; }
.ta-tier-preferido { cursor: pointer; }
.ta-tier-preferido input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.ta-tier-preferido span { display: block; border: 1px solid var(--opg-tinta); border-radius: 999px; background: #fff; padding: 4px 9px; font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 11px; }
.ta-tier-preferido input:checked + span { background: var(--opg-morado-cta); color: #fff; }
.ta-tier-preferido input:focus-visible + span { outline: 3px solid var(--opg-morado); outline-offset: 2px; }
a.btn-op:link, a.btn-op:visited { color: #fff; text-decoration: none; }

/* ── Bloque destacado: aventuras sin narrador ───────────────────────────── */
.ta-sin-bloque { display: flex; flex-direction: column; gap: var(--opg-espacio-4); }
.ta-sin-cabecera { display: flex; align-items: center; justify-content: space-between; gap: var(--opg-espacio-3); border-bottom: 3px solid var(--opg-morado); padding-bottom: 8px; }
.ta-sin-cabecera h2 { margin: 0; font-family: var(--opg-fuente-titular); font-size: 20px; letter-spacing: 0; color: var(--opg-ciruela); }
.ta-sin-cifra, .opg-chip.ta-sin-cifra { flex: 0 0 auto; padding: 4px 10px; font-family: InterMedium, var(--opg-fuente-cuerpo); font-size: 12px; line-height: 1.2; color: var(--opg-morado-texto); background: #e8d9ff; border-color: var(--opg-morado); }
.ta-sin-cuerpo { display: flex; flex-direction: column; gap: var(--opg-espacio-4); }
.ta-sin-intro { margin: 0; font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); }
.ta-ver-mas { display: flex; justify-content: center; }
.ta-sin-bloque .ta-tarjetas { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 600px)); justify-content: start; gap: 10px; }
.ta-sin-bloque .ta-card { padding: 10px 12px; gap: 4px; }
.ta-sin-bloque .ta-card .opg-card__titulo { font-size: 16px; }
.ta-sin-bloque .ta-meta, .ta-sin-bloque .ta-yo, .ta-sin-bloque .ta-datos { font-size: 11px; }
.ta-sin-bloque .ta-datos { gap: 4px 12px; }
.ta-sin-bloque .ta-dato-narrador { display: none; }
.ta-sin-bloque .ta-nota-comentario { padding: 5px 8px; }
.ta-sin-bloque .ta-nota-comentario p { -webkit-line-clamp: 1; }
.ta-sin-bloque .ta-accion-principal { padding: 5px 10px; font-size: 12px; }

/* ── Formularios ────────────────────────────────────────────────────────── */
.ta-form { display: flex; flex-direction: column; gap: 16px; padding: 4px 0 0; }
.ta-form-seccion { display: flex; flex-direction: column; gap: 12px; padding: 0 0 16px; border-bottom: 1px solid var(--opg-gris-bloqueado); }
.ta-form-seccion > h3 { display: flex; align-items: center; gap: 8px; margin: 0; font-family: var(--opg-fuente-titular); font-size: 16px; color: var(--opg-ciruela); }
.ta-form-seccion > h3 i { color: var(--opg-naranja); font-size: 14px; }
.ta-switch { display: flex; flex-direction: column; gap: 12px; }
.ta-personas-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; align-items: start; }
.ta-form .af-field > label { text-transform: none; }
.ta-selector-busqueda { display: none; }
.ta-selector-abierto .ta-selector-busqueda { display: block; }
.ta-selector-abierto .ta-anadir { display: none; }
.ta-switch:has(#ta-rol-n:checked):not(:has(.ta-participantes input)) .ta-selector-busqueda { display: block; }
.ta-switch:has(#ta-rol-n:checked):not(:has(.ta-participantes input)) .ta-anadir { display: none; }
.ta-chips > .ta-buscador { width: 100%; }
.ta-fila { display: flex; flex-wrap: wrap; gap: var(--opg-espacio-3) var(--opg-espacio-4); align-items: flex-start; }
.ta-fila > * { flex: 1 1 220px; }
.ta-isla { display: flex; flex-direction: column; gap: 8px; }
.ta-isla > .ta-buscador { flex: 0 0 auto; }
.ta-bloque { display: flex; flex-direction: column; gap: var(--opg-espacio-2); }
.ta-chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 8px; }
.ta-chip { font-size: 13px; }
.ta-chip small { opacity: .75; }
.ta-quitar { border: 0; background: none; cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; color: var(--opg-rojo-error); }
.ta-casilla { display: flex; align-items: center; gap: 8px; font-family: var(--opg-fuente-cuerpo); font-size: 13px; color: var(--opg-marron); }
.ta-form-datos .ta-casilla { width: max-content; max-width: 100%; padding: 2px 0; }
.ta-form-descripcion textarea { min-height: 110px; }
.ta-propuesta { padding: 10px 12px; border-left: 4px solid var(--opg-morado); background: rgba(255,255,255,.6); }
.ta-propuesta textarea { min-height: 88px; }
.ta-form:has(input[name="tiene_narrador"][value="1"]:checked) .ta-propuesta,
.ta-form:has(#ta-rol-n:checked) .ta-propuesta { display: none; }
.ta-form-pie { justify-content: flex-end; padding-top: 0; }
.ta-grupo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border: 0; margin: 0; padding: 0; min-width: 0; }
